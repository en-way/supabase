<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with modern squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="3" opacity="0.6"/>

  <!-- Glowing background ring -->
  <circle cx="256" cy="240" r="140" fill="url(#accentGrad)" opacity="0.12" filter="url(#glow)"/>

  <!-- Stylized Open Book / Wings Motif -->
  <path d="M256 340 C210 300 130 300 90 320 L90 190 C130 170 210 170 256 210 Z" fill="url(#accentGrad)" opacity="0.85"/>
  <path d="M256 340 C302 300 382 300 422 320 L422 190 C382 170 302 170 256 210 Z" fill="url(#accentGrad)"/>
  
  <!-- Book spine line -->
  <line x1="256" y1="205" x2="256" y2="345" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

  <!-- Graduation Cap Top Accent -->
  <path d="M256 120 L370 165 L256 210 L142 165 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  
  <!-- Star / North Star / Sparkle of Success -->
  <polygon points="256,70 262,90 282,96 262,102 256,122 250,102 230,96 250,90" fill="#fef08a"/>
</svg>
